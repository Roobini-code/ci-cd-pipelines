name: Taskboard Java CI/CD

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS Region containing the Taskboard EC2 instance
        required: false
        default: ""
        type: string
      ec2_instance_id:
        description: EC2 instance ID to deploy to through Systems Manager
        required: false
        default: ""
        type: string
      aws_role_arn:
        description: IAM role assumed by GitHub Actions through OIDC
        required: false
        default: ""
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test application
        run: mvn -B clean verify

      - name: Build Docker image without publishing
        run: docker buildx build --load --tag taskboard:ci .

  publish-deploy:
    name: Publish image and deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment inputs
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          EC2_INSTANCE_ID: ${{ inputs.ec2_instance_id }}
          AWS_ROLE_ARN: ${{ inputs.aws_role_arn }}
        run: |
          for name in AWS_REGION EC2_INSTANCE_ID AWS_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required workflow input $name is not configured"
              exit 1
            fi
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate unique release and image tags
        id: release
        shell: bash
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid Maven project version: $version"
            exit 1
          fi
          image_tag="${version}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned and latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            roobinidevops/taskboard-java:${{ steps.release.outputs.image_tag }}
            roobinidevops/taskboard-java:latest

      - name: Configure AWS credentials with GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy image to EC2 through Systems Manager
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ inputs.ec2_instance_id }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          for name in EC2_INSTANCE_ID IMAGE_TAG; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required workflow input $name is not configured"
              exit 1
            fi
          done

          if [[ ! "$IMAGE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid Docker image tag: $IMAGE_TAG"
            exit 1
          fi

          {
            printf "IMAGE_TAG='%s'\n" "$IMAGE_TAG"
            cat <<'REMOTE_SCRIPT'
          set -eu
          image="roobinidevops/taskboard-java:${IMAGE_TAG}"
          previous_image=""

          sudo docker pull "$image"
          sudo docker volume create taskboard-data >/dev/null
          if sudo docker container inspect taskboard >/dev/null 2>&1; then
            previous_image="$(sudo docker container inspect --format '{{.Config.Image}}' taskboard)"
            sudo docker rm -f taskboard
          fi

          run_taskboard() {
            sudo docker run -d \
              --name taskboard \
              --restart unless-stopped \
              -p 80:8080 \
              -e PORT=8080 \
              -e DATA_DIR=/data \
              -v taskboard-data:/data \
              "$1"
          }

          if ! run_taskboard "$image"; then
            if sudo docker container inspect taskboard >/dev/null 2>&1; then
              sudo docker rm -f taskboard
            fi
            if [ -n "$previous_image" ]; then
              echo "New container failed to start; restoring $previous_image" >&2
              run_taskboard "$previous_image"
            fi
            exit 1
          fi

          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl --fail --silent --output /dev/null http://127.0.0.1/; then
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done

          sudo docker logs --tail=100 taskboard >&2
          sudo docker rm -f taskboard
          if [ -n "$previous_image" ]; then
            echo "New container failed its health check; restoring $previous_image" >&2
            run_taskboard "$previous_image"
          fi
          echo "Taskboard did not become healthy after deployment" >&2
          exit 1
          REMOTE_SCRIPT
          } > "$RUNNER_TEMP/deploy-taskboard.sh"

          parameters="$(jq -n --rawfile script "$RUNNER_TEMP/deploy-taskboard.sh" '{commands: [$script]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Taskboard image ${IMAGE_TAG}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in {1..60}; do
            if invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>&1)"; then
              status="$(jq -r '.Status' <<< "$invocation")"
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' <<< "$invocation"
                  exit 0
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$invocation" >&2
                  echo "::error::SSM deployment command ended with status $status"
                  exit 1
                  ;;
              esac
            elif [[ "$invocation" != *InvocationDoesNotExist* ]]; then
              echo "$invocation" >&2
              exit 1
            fi
            sleep 5
          done

          aws ssm cancel-command --command-id "$command_id" >/dev/null
          echo "::error::Timed out waiting for the SSM deployment command"
          exit 1

      - name: Create and push Git tag
        shell: bash
        env:
          GIT_TAG: ${{ steps.release.outputs.git_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GIT_TAG" -m "Deploy taskboard $GIT_TAG"
          git push origin "$GIT_TAG"
