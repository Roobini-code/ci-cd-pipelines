name: Taskboard Java CI/CD

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      EC2_HOST:
        required: false
      EC2_SSH_PRIVATE_KEY:
        required: false
      EC2_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test application
        run: mvn -B clean verify

      - name: Build Docker image without publishing
        run: docker buildx build --load --tag taskboard:ci .

  publish-deploy:
    name: Publish image and deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate unique release and image tags
        id: release
        shell: bash
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid Maven project version: $version"
            exit 1
          fi
          image_tag="${version}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "git_tag=v$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned and latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            roobinidevops/taskboard-java:${{ steps.release.outputs.image_tag }}
            roobinidevops/taskboard-java:latest

      - name: Deploy image to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          for name in EC2_HOST EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret $name is not configured"
              exit 1
            fi
          done

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/ec2_key" "$RUNNER_TEMP/known_hosts"

          ssh \
            -i "$RUNNER_TEMP/ec2_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "ec2-user@$EC2_HOST" \
            "bash -s -- '$IMAGE_TAG'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          image_tag="$1"
          image="roobinidevops/taskboard-java:${image_tag}"
          previous_image=""

          sudo docker pull "$image"
          sudo docker volume create taskboard-data >/dev/null
          if sudo docker container inspect taskboard >/dev/null 2>&1; then
            previous_image="$(sudo docker container inspect --format '{{.Config.Image}}' taskboard)"
            sudo docker rm -f taskboard
          fi

          run_taskboard() {
            sudo docker run -d \
              --name taskboard \
              --restart unless-stopped \
              -p 80:8080 \
              -e PORT=8080 \
              -e DATA_DIR=/data \
              -v taskboard-data:/data \
              "$1"
          }

          if ! run_taskboard "$image"; then
            if [[ -n "$previous_image" ]]; then
              echo "New container failed to start; restoring $previous_image" >&2
              run_taskboard "$previous_image"
            fi
            exit 1
          fi

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1/; then
              exit 0
            fi
            sleep 2
          done

          sudo docker logs --tail=100 taskboard >&2
          sudo docker rm -f taskboard
          if [[ -n "$previous_image" ]]; then
            echo "New container failed its health check; restoring $previous_image" >&2
            run_taskboard "$previous_image"
          fi
          echo "Taskboard did not become healthy after deployment" >&2
          exit 1
          REMOTE_SCRIPT

      - name: Create and push Git tag
        shell: bash
        env:
          GIT_TAG: ${{ steps.release.outputs.git_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GIT_TAG" -m "Deploy taskboard $GIT_TAG"
          git push origin "$GIT_TAG"
