name: Reusable K8s app main-branch CD

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username.
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub access token with write permission.
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ github.sha }}
    steps:
      - name: Check out application repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test blue/green manifest promotion
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Set Docker Hub image name
        id: metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          image="docker.io/$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/k8s-app-deployment"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out application repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update Kubernetes Deployment image
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.tag }}
        run: |
          python scripts/promote_image.py --image "$IMAGE"

      - name: Commit manifest change for Argo CD
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.tag }}
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Manifest already points to $IMAGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- k8s/base/deployment-blue.yaml k8s/base/deployment-green.yaml k8s/base/service.yaml
          git commit -m "chore(deploy): promote ${IMAGE##*:}"
          git push
